<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또 번호 뽑기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #edf3fb;
      color: #14243b;
      font-family: system-ui, "맑은 고딕", sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 720px);
      padding: clamp(20px, 5vw, 48px);
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 36px #14243b18;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.2;
    }

    #status {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.5;
    }

    .balls {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 16px);
      margin: 28px auto;
      max-width: 570px;
    }

    .ball {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 50%;
      color: #fff;
      font-size: clamp(1.75rem, 7vw, 2.75rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 -5px #0002;
    }

    .ball:nth-child(1) { background: #a73320; }
    .ball:nth-child(2) { background: #805404; }
    .ball:nth-child(3) { background: #146332; }
    .ball:nth-child(4) { background: #00616a; }
    .ball:nth-child(5) { background: #254eb1; }
    .ball:nth-child(6) { background: #703694; }

    .buttons { display: grid; gap: 12px; }

    button {
      width: 100%;
      min-height: 64px;
      padding: 12px 16px;
      border: 2px solid #17459d;
      border-radius: 14px;
      background: #17459d;
      color: #fff;
      font-family: inherit;
      font-size: 1.625rem;
      font-weight: 750;
      cursor: pointer;
    }

    #redraw { background: #fff; color: #17459d; }
    button:hover:not([aria-disabled="true"]) { filter: brightness(0.9); }
    button:focus-visible { outline: 4px solid #885000; outline-offset: 3px; }
    button[aria-disabled="true"] { opacity: 0.6; cursor: default; }

    @media (max-width: 600px) {
      .balls { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 330px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>로또 번호 뽑기</h1>
    <p id="status" role="status">1부터 45까지 중 6개를 뽑아요.</p>

    <div class="balls" aria-hidden="true">
      <span class="ball">–</span>
      <span class="ball">–</span>
      <span class="ball">–</span>
      <span class="ball">–</span>
      <span class="ball">–</span>
      <span class="ball">–</span>
    </div>

    <div class="buttons">
      <button id="draw" type="button">번호 뽑기</button>
      <button id="redraw" type="button" aria-disabled="true">다시 뽑기</button>
    </div>
  </main>

  <script>
    const balls = document.querySelectorAll(".ball");
    const statusText = document.querySelector("#status");
    const drawButton = document.querySelector("#draw");
    const redrawButton = document.querySelector("#redraw");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function pickNumbers() {
      const pool = Array.from({ length: 45 }, (_, index) => index + 1);
      const numbers = [];

      for (let count = 0; count < balls.length; count++) {
        const index = Math.floor(Math.random() * pool.length);
        numbers.push(pool.splice(index, 1)[0]);
      }

      return numbers;
    }

    function showNumbers(numbers) {
      balls.forEach((ball, index) => {
        ball.textContent = numbers[index];
      });
    }

    function drawNumbers(event) {
      if (event.currentTarget.getAttribute("aria-disabled") === "true") return;

      drawButton.setAttribute("aria-disabled", "true");
      redrawButton.setAttribute("aria-disabled", "true");

      const result = pickNumbers().sort((a, b) => a - b);

      function finishDraw() {
        showNumbers(result);
        statusText.textContent = "뽑힌 번호는 " + result.join(", ") + "입니다.";
        drawButton.removeAttribute("aria-disabled");
        redrawButton.removeAttribute("aria-disabled");
      }

      if (reducedMotion.matches) {
        finishDraw();
        return;
      }

      statusText.textContent = "번호를 뽑고 있어요…";
      showNumbers(pickNumbers());

      const rolling = window.setInterval(() => showNumbers(pickNumbers()), 75);
      window.setTimeout(() => {
        window.clearInterval(rolling);
        finishDraw();
      }, 850);
    }

    drawButton.addEventListener("click", drawNumbers);
    redrawButton.addEventListener("click", drawNumbers);
  </script>
</body>
</html>
